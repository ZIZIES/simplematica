plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.+'
	id 'maven-publish'
}

repositories {
	mavenLocal()
	maven { url = "https://masa.dy.fi/maven/sakura-ryoko"
		content {includeGroupAndSubgroups("fi.dy.masa")}
	}
	maven { url = 'https://maven.fallenbreath.me/releases'
		content {includeGroupAndSubgroups("me.fallenbreath")}
	}
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc")}
	}
	maven { url = 'https://jitpack.io'
		content { includeGroupAndSubgroups("com.github")}
	}
//	maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"
//	implementation "org.jspecify:jspecify:1.0.0"

	implementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version_out}:${project.malilib_version}"
//	implementation "com.github.sakura-ryoko:malilib:${project.malilib_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
//	compileOnly fabricApi.module("fabric-api-base", project.fabric_api_version)
//	compileOnly fabricApi.module("fabric-networking-api-v1", project.fabric_api_version)
//	compileOnly fabricApi.module("fabric-resource-loader-v1", project.fabric_api_version)
	include(implementation("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))

	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
//	compileOnly "maven.modrinth:iris:${project.iris_version}+${project.iris_mc_version}-fabric"
//	runtimeOnly 'me.fallenbreath:mixin-auditor:0.2.0-u'
}

base {
	group = project.group + "." + project.mod_id
	archivesName = project.mod_file_name + '-' + project.minecraft_version_out
	version = project.mod_version

	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
    accessWidenerPath = file("src/main/resources/litematica.accesswidener")

//	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=true']
//	// [FEATURE] MIXIN_AUDITOR
//	runs {
//		def auditVmArgs = [*commonVmArgs, '-DmixinAuditor.audit=true']
//		clientMixinAudit {
//			client()
//			vmArgs auditVmArgs
//			ideConfigGenerated false
//		}
//	}
}

processResources {
	// Exclude the GIMP image files
	exclude '**/*.xcf'
	exclude '**/xcf'

	// this will ensure that this task is redone when the versions change.
	//inputs.property "minecraft_version", project.project.minecraft_version

	inputs.property "mod_version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 26.1+ uses Java 25.
	it.options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = true
	//reproducibleFileOrder = true
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}"}
	}
}

tasks.publish.dependsOn build
publishing {
	publications {
		mavenJava(MavenPublication) {
			// How to introduce archivesName here without it breaking?
			artifactId = base.archivesName.get()

			// add all the jars that should be included when publishing to maven
			//artifact(jar)             { builtBy remapJar }
			from components.java
		}
	}

	repositories {
		maven {
			url = "$projectDir/../../CommonMaven"
		}
	}
}


// ---------------------------------------------------------------------------
// Simplematica: copy the built jar straight into a Minecraft instance's mods
// folder after every build, so testing a change is just `gradlew build`.
//
// Point it at whatever instance you test with by setting `mods_dir` in
// gradle.properties, in ~/.gradle/gradle.properties, or on the command line:
//     gradlew build -Pmods_dir="C:/path/to/instance/mods"
// Leave `mods_dir` empty to turn the copy off.
//
// Loom 1.17 remaps in place, so the `jar` task output is the finished mod jar.
// ---------------------------------------------------------------------------
def modsDir = (project.findProperty('mods_dir') ?: '').toString().trim()

tasks.register('copyJarToMods', Copy) {
	group = 'build'
	description = 'Copies the built jar into the mods folder given by the mods_dir property.'

	onlyIf {
		if (modsDir.isEmpty()) {
			logger.lifecycle('[mods] mods_dir is not set, skipping copy.')
			return false
		}
		if (!file(modsDir).isDirectory()) {
			logger.warn("[mods] mods_dir does not exist, skipping copy: ${modsDir}")
			return false
		}
		return true
	}

	from tasks.named('jar')
	into modsDir

	doFirst {
		// Fabric Loader refuses to launch when two jars declare the same mod id,
		// so clear out older builds of this mod before dropping the new one in.
		// Both names are matched so this keeps working across the rename.
		fileTree(modsDir) {
			include 'litematica-fabric-*.jar'
			include 'simplematica-fabric-*.jar'
		}.files.each {
			logger.lifecycle("[mods] removing older jar: ${it.name}")
			it.delete()
		}
	}

	doLast {
		logger.lifecycle("[mods] ${tasks.named('jar').get().archiveFileName.get()} -> ${modsDir}")
	}
}

tasks.named('build') {
	finalizedBy 'copyJarToMods'
}
